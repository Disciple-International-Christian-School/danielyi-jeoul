name: Verify Daniels Scale production build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'netlify.toml'
      - '.github/workflows/netlify-deploy.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'netlify.toml'
      - '.github/workflows/netlify-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: danielyi-jeoul-netlify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Verify project
        run: npm run typecheck
      - name: Check production build
        run: npm run build

