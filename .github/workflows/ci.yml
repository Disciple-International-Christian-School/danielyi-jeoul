name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "gpt/**"

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check migration versions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)

          bad=0
          versions=()
          for file in "${files[@]}"; do
            if [[ ! "$file" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "::error::Invalid migration filename: $file"
              bad=1
              continue
            fi
            versions+=("${file:0:14}")
          done

          duplicates="$(printf '%s\n' "${versions[@]}" | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "::error::Duplicate migration version(s): $duplicates"
            bad=1
          fi

          if [[ "$bad" -ne 0 ]]; then
            exit 1
          fi

          echo "Migration versions are unique: ${#versions[@]} files"

      - name: Check migration ledger
        run: npm run check:migration-ledger

      - name: Check migration tool syntax
        run: node --check scripts/migrate-sp-external-identities.mjs

      - name: Check bilingual documentation
        run: npm run check:docs

      - name: Check new commit language
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commit-language.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Check history tool syntax
        run: python3 -m py_compile scripts/prepare-english-history.py

      - name: History regression checks
        run: node scripts/test-history.mjs && node scripts/test-weekly-import.mjs

      - name: Reflection queue regression checks
        run: node scripts/test-reflection-queue.mjs

      - name: Notice date isolation regression checks
        run: node scripts/test-seondo-notice-date.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  teacher-points:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Exercise teacher entry, cancellation, calendar changes and catch-up
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/fixtures/seondo.sql \
            -f supabase/migrations/20261116124919_seondo_notice_and_settlements.sql \
            -f supabase/tests/fixtures/teacher_points.sql \
            -f supabase/proposals/teacher_points.sql \
            -f supabase/tests/teacher_points.sql
