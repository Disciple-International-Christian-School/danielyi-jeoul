name: Prepare Netlify deploy bundle

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Netlify MCP deploy tool
        run: npm install --prefix .netlify-mcp @netlify/mcp@1.15.1

      - name: Record deploy tool metadata
        run: node -e "const fs=require('fs'); const p=require('./.netlify-mcp/node_modules/@netlify/mcp/package.json'); fs.writeFileSync('.netlify-mcp-bin.json', JSON.stringify({bin:p.bin,version:p.version}, null, 2));"

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: netlify-deploy-bundle
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
          path: |
            package.json
            package-lock.json
            index.html
            tsconfig*.json
            vite.config.*
            netlify.toml
            public
            src
            .netlify-mcp
            .netlify-mcp-bin.json
