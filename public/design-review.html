<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다니엘의 저울 · 디자인 검증</title><style>body{margin:0;background:#dadfd9;font:14px system-ui}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid #ccc}button,select{font:inherit;padding:6px 10px}main{overflow:auto;padding:16px;display:flex;justify-content:center}iframe{border:0;box-shadow:0 8px 30px #0001;width:100%;height:1250px;flex-shrink:0}</style></head><body><header><strong>디자인 검증 · 가상 데이터</strong><label>화면 너비 <select id="size"><option value="100%">데스크톱</option value="1024px">태블릿 1024</option><option value="390px">모바일 390</option><option value="320px">모바일 320</option></select></label><label>데이터 상태 <select id="state"><option value="normal">일반</option><option value="setup">설정 전</option><option value="loading">불러오는 중</option><option value="error">조회 실패</option><option value="empty">대상자 없음</option><option value="member">일반 선도부원</option></select></label></header><main><iframe title="대시보드 검증 화면" id="frame" src="design-review-frame.html"></iframe></main><script>document.getElementById('size').onchange=e=>document.getElementById('frame').style.width=e.target.value;document.getElementById('state').onchange=e=>document.getElementById('frame').src='design-review-frame.html?state='+e.target.value;</script></body></html>
